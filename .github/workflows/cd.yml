name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test before shipping
        working-directory: ./app
        run: mvn --batch-mode verify -Dtest='!PostgresIntegrationTests'

      - name: Compute image tag (short SHA)
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "image=${{ vars.IMAGE_NAME}}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Computed image: ${{ vars.IMAGE_NAME }}:${SHORT_SHA}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Trivy image scan
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress ${{ steps.meta.outputs.image }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (sha + latest)
        run: |
          docker tag ${{ steps.meta.outputs.image }} ${{ vars.IMAGE_NAME }}:latest
          docker push ${{ steps.meta.outputs.image }}
          docker push ${{ vars.IMAGE_NAME }}:latest

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to staging via SSM
        run: |
          set -euo pipefail
          IMAGE="${{ needs.build-push.outputs.image }}"
          if [ -z "$IMAGE"n]; then echo "build-path produced no image output"; exit 1; fi
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.APP_INSTANCE_TAG }}" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ]; then echo "No running staging instance for tag ${{ vars.APP_INSTANCE_TAG }}"; exit 1; fi
          echo "Deploying $IMAGE to $INSTANCE_ID"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $IMAGE" \
            --parameters commands="sudo /opt/deploy/deploy.sh $IMAGE" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Result: $STATUS"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text || true
          [ "$STATUS" = "Success" ]

  deploy-production:
    needs: [ build-push, deploy-staging ]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to production via SSM
        run: |
          set -euo pipefail
          IMAGE="${{ needs.build-push.outputs.image }}"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.PROD_INSTANCE_TAG }}" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ]; then echo "No running production instance for tag ${{ vars.PROD_INSTANCE_TAG }}"; exit 1; fi
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Prod deploy $IMAGE" \
            --parameters commands="sudo /opt/deploy/deploy.sh $IMAGE" \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Result: $STATUS"
          [ "$STATUS" = "Success" ]

  notify-failure:
    needs: [ build-push, deploy-staging, deploy-production ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Email on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "CD failed: ${{ github.repository }}"
          body: |
            A CD job failed.
            Repo:   ${{ github.repository }}
            Commit: ${{ github.sha }}
            Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
