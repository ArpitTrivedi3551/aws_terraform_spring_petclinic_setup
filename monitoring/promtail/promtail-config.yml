server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # System logs
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: app-instance
          __path__: /var/log/*log

  # Application + container logs (Docker JSON logs)
  - job_name: containers
    static_configs:
      - targets: [localhost]
        labels:
          job: containerlogs
          host: app-instance
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
      - output:
          source: output
