global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Infrastructure metrics: CPU, memory, disk
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Container metrics
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Application metrics: request rate, error rate, latency (Spring Actuator/Micrometer)
  - job_name: petclinic
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # Database metrics (RDS PostgreSQL via exporter)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
